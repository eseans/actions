# Kod degisikliginde testler. Yedek is akisindan ayri: bir test arizasi
# gece yedegini engellemesin, ama hatali kod da fark edilmeden kalmasin.
# Yalniz uydurma veriyle calisir; hicbir gizli anahtar kullanmaz.
name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
